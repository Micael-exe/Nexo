services:
  - type: web
    name: canal-em-dia
    runtime: docker
    plan: free             # sem disco: os dados somem a cada deploy/reinício
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false        # gerar com: php artisan key:generate --show
      - key: APP_URL
        sync: false        # https://SEU-SERVICO.onrender.com
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: CANAL_CODIGO_CADASTRO
        sync: false        # código longo para cadastrar servidores
      - key: CANAL_DEMO      # recria relatos fictícios a cada início
        value: "1"
      - key: CANAL_DEMO_EMAIL
        sync: false        # e-mail do servidor de demonstração (opcional)
      - key: CANAL_DEMO_PASSWORD
        sync: false        # senha com 10+ caracteres (opcional)
